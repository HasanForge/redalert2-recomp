# Put this at .github/workflows/compile-test.yml in YOUR fork of
# https://github.com/sp00nznet/redalert2-recomp
#
# Job 1 (host-compile): runs on GitHub's free Windows runner. Compiles the
#   host/runtime C sources with MSVC x86 against a stub in place of the lifted
#   code. Catches broken host code. Link errors are expected and ignored.
#
# Job 2 (full-build): manual only, on YOUR Windows PC registered as a
#   self-hosted runner. Runs the real pipeline from the README: catalog, lift,
#   build. Needs your own copy of the game, so it can't run on GitHub's runners.

name: Compile test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        description: "Run the full lift + build on a self-hosted runner"
        type: boolean
        default: false
      also_ra2:
        description: "Also build Red Alert 2 (game.exe), not just Yuri's Revenge"
        type: boolean
        default: false

jobs:
  host-compile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # The CMake file expects pcrecomp checked out as ..\tools next to the repo
      - uses: actions/checkout@v4
        with:
          path: ra2

      - uses: actions/checkout@v4
        with:
          repository: sp00nznet/pcrecomp
          path: tools

      # amd64_x86 = 64-bit compiler targeting x86, same as build.cmd
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Make sure Ninja exists
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      # CMake refuses to configure if src/recomp/gen has no .c files
      - name: Stub the lifted code
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ra2/src/recomp/gen | Out-Null
          "int ra2_ci_stub;" | Set-Content ra2/src/recomp/gen/ci_stub.c

      - name: Configure
        run: cmake -S ra2 -B ra2/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compile host sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # -k 0 keeps going after the (expected) link failure
          cmake --build ra2/build -- -k 0 2>&1 | Tee-Object -FilePath build.log
          $bad = Select-String -Path build.log -Pattern 'error C\d+|fatal error C\d+'
          if ($bad) {
            Write-Host "::error::Compile errors found"
            $bad | ForEach-Object { $_.Line }
            exit 1
          }
          Write-Host "No compiler errors. Link errors are expected (lifted code is stubbed)."
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-compile-log
          path: build.log

  full-build:
    if: github.event_name == 'workflow_dispatch' && inputs.full_build
    # Your own PC, registered as a runner. Add a custom label to pin it if needed.
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
        working-directory: ra2
    env:
      # Repo variable (Settings > Secrets and variables > Actions > Variables).
      # Folder that holds game.exe and gamemd.exe.
      RA2_GAME_DIR: ${{ vars.RA2_GAME_DIR }}
    steps:
      # clean: false keeps game\ and work\ between runs, so the 15 minute
      # function catalog only happens the first time.
      - uses: actions/checkout@v4
        with:
          path: ra2
          clean: false

      - uses: actions/checkout@v4
        with:
          repository: sp00nznet/pcrecomp
          path: tools
          clean: false

      - name: Python packages
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          py -3 -m pip install --user pefile capstone

      - name: Copy game files
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $src = $env:RA2_GAME_DIR
          if (-not $src) { $src = "C:\Program Files (x86)\Steam\steamapps\common\Command & Conquer Red Alert II" }
          if (-not (Test-Path "game\gamemd.exe")) {
            robocopy $src game /E /NFL /NDL /NJH /NJS
            if ($LASTEXITCODE -ge 8) { Write-Host "::error::robocopy failed"; exit 1 }
          }
          exit 0

      # ---- Yuri's Revenge (gamemd.exe -> build\ra2.exe)
      - name: YR - analyze + RTTI
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force work | Out-Null
          py -3 ..\tools\tools\pe\pe_analyze.py game\gamemd.exe --json work\pe_analysis.json
          py -3 ..\tools\tools\cpp\rtti.py game\gamemd.exe -o work\rtti.json --seeds work\rtti_seeds.json

      - name: YR - function catalog (about 15 min, skipped if cached)
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Test-Path work\functions.json)) {
            py -3 ..\tools\tools\disasm\disasm32.py game\gamemd.exe -o work\functions.json --seed-functions work\rtti_seeds.json
          }

      - name: YR - lift
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          py -3 run_lift.py --all

      - name: YR - build
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /c build.cmd 2>&1 | Tee-Object -FilePath build-yr.log
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::YR build failed"; exit $LASTEXITCODE }
          if (-not (Test-Path build\ra2.exe)) { Write-Host "::error::build\ra2.exe missing"; exit 1 }

      - name: YR - conformance (boot milestones, optional)
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          py -3 tools\conformance.py 2>&1 | Tee-Object -FilePath conformance-yr.log

      # ---- Red Alert 2 (game.exe -> build-game\ra2.exe)
      - name: RA2 - analyze, RTTI, catalog
        if: inputs.also_ra2
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force work\game | Out-Null
          py -3 ..\tools\tools\pe\pe_analyze.py game\game.exe --json work\game\pe_analysis.json
          py -3 ..\tools\tools\cpp\rtti.py game\game.exe -o work\game\rtti.json --seeds work\game\rtti_seeds.json
          if (-not (Test-Path work\game\functions.json)) {
            py -3 ..\tools\tools\disasm\disasm32.py game\game.exe -o work\game\functions.json --seed-functions work\game\rtti_seeds.json
          }

      - name: RA2 - lift
        if: inputs.also_ra2
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          py -3 run_lift.py --all --target game

      - name: RA2 - build
        if: inputs.also_ra2
        run: |
          $ErrorActionPreference = 'Continue'
          $env:BUILD_DIR = 'build-game'
          $env:CMAKE_ARGS = '-DRA2_TARGET=game'
          cmd /c build.cmd 2>&1 | Tee-Object -FilePath build-ra2.log
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::RA2 build failed"; exit $LASTEXITCODE }
          if (-not (Test-Path build-game\ra2.exe)) { Write-Host "::error::build-game\ra2.exe missing"; exit 1 }

      # Logs only. Never upload ra2.exe or the lifted C: they are derived from
      # EA's game and the repo's license says they must not be distributed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-build-logs
          path: |
            ra2/build-yr.log
            ra2/build-ra2.log
            ra2/conformance-yr.log
          if-no-files-found: ignore
